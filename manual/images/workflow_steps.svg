<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="100%" height="100%">
  <defs>
    <linearGradient id="stepGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242B2E"/>
      <stop offset="100%" stop-color="#1A2022"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4B6651"/>
    </marker>
  </defs>

  <rect width="960" height="300" rx="14" fill="#141718" stroke="#333E42" stroke-width="1.5"/>

  <!-- タイトル -->
  <text x="30" y="40" fill="#D6C5A0" font-family="'Noto Serif JP', serif" font-size="16" font-weight="bold">LVTT 議論ライフサイクル &amp; 操作ステップフロー</text>
  <text x="30" y="60" fill="#809299" font-family="sans-serif" font-size="11">テーマ入力からプロデュース、自律議論、人間介入、議事録確定、次フェーズリレーまで</text>

  <!-- ステップ 1: 助走モード -->
  <g transform="translate(30, 85)">
    <rect width="165" height="180" rx="10" fill="url(#stepGrad)" stroke="#3E4C52" stroke-width="1.2"/>
    <rect x="12" y="14" width="28" height="28" rx="6" fill="#3B6978"/>
    <text x="21" y="33" fill="#FFF" font-family="sans-serif" font-weight="bold" font-size="14">1</text>
    <text x="48" y="33" fill="#FFF" font-family="sans-serif" font-weight="bold" font-size="12">助走 &amp; 前提入力</text>
    <text x="14" y="65" fill="#D1D5DB" font-size="10">• テーマ入力 (複数行)</text>
    <text x="14" y="85" fill="#D1D5DB" font-size="10">• 背景・制約入力 (自動伸縮)</text>
    <text x="14" y="105" fill="#D1D5DB" font-size="10">• 議論モード選択 (5種類)</text>
    <text x="14" y="125" fill="#D1D5DB" font-size="10">• ラウンド数・言語設定</text>
    <rect x="14" y="142" width="137" height="24" rx="4" fill="#2E5A35"/>
    <text x="28" y="158" fill="#FFF" font-size="10" font-weight="bold">✨ AIプロデュース</text>
  </g>

  <!-- 矢印 1 -> 2 -->
  <line x1="202" y1="175" x2="222" y2="175" stroke="#4B6651" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ステップ 2: プレビュー & チューニング -->
  <g transform="translate(225, 85)">
    <rect width="165" height="180" rx="10" fill="url(#stepGrad)" stroke="#3E4C52" stroke-width="1.2"/>
    <rect x="12" y="14" width="28" height="28" rx="6" fill="#4F46E5"/>
    <text x="21" y="33" fill="#FFF" font-family="sans-serif" font-weight="bold" font-size="14">2</text>
    <text x="48" y="33" fill="#FFF" font-family="sans-serif" font-weight="bold" font-size="12">設計プレビュー</text>
    <text x="14" y="65" fill="#D1D5DB" font-size="10">• ゴール3点自動抽出</text>
    <text x="14" y="85" fill="#D1D5DB" font-size="10">• 主要アジェンダ3点確認</text>
    <text x="14" y="105" fill="#D1D5DB" font-size="10">• 最適ペルソナ3名選定</text>
    <text x="14" y="125" fill="#D1D5DB" font-size="10">• 特化プロンプト微調整</text>
    <rect x="14" y="142" width="137" height="24" rx="4" fill="#4338CA"/>
    <text x="30" y="158" fill="#FFF" font-size="10" font-weight="bold">🚀 会議室へ入場</text>
  </g>

  <!-- 矢印 2 -> 3 -->
  <line x1="397" y1="175" x2="417" y2="175" stroke="#4B6651" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ステップ 3: 自律議論 & 人間介入 (HITL) -->
  <g transform="translate(420, 85)">
    <rect width="165" height="180" rx="10" fill="url(#stepGrad)" stroke="#3E4C52" stroke-width="1.2"/>
    <rect x="12" y="14" width="28" height="28" rx="6" fill="#B45309"/>
    <text x="21" y="33" fill="#FFF" font-family="sans-serif" font-weight="bold" font-size="14">3</text>
    <text x="48" y="33" fill="#FFF" font-family="sans-serif" font-weight="bold" font-size="12">自律議論 &amp; 介入</text>
    <text x="14" y="65" fill="#D1D5DB" font-size="10">• AI自律周回ブレスト</text>
    <text x="14" y="85" fill="#D1D5DB" font-size="10">• 1発言ごとの即時コミット</text>
    <text x="14" y="105" fill="#D1D5DB" font-size="10">• 人間による割り込み指示</text>
    <text x="14" y="125" fill="#D1D5DB" font-size="10">• 一時停止・延長・再開</text>
    <rect x="14" y="142" width="137" height="24" rx="4" fill="#92400E"/>
    <text x="32" y="158" fill="#FFF" font-size="10" font-weight="bold">💬 HITLリアルタイム</text>
  </g>

  <!-- 矢印 3 -> 4 -->
  <line x1="592" y1="175" x2="612" y2="175" stroke="#4B6651" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ステップ 4: 議事録推敲 & 出力 -->
  <g transform="translate(615, 85)">
    <rect width="150" height="180" rx="10" fill="url(#stepGrad)" stroke="#3E4C52" stroke-width="1.2"/>
    <rect x="12" y="14" width="28" height="28" rx="6" fill="#047857"/>
    <text x="21" y="33" fill="#FFF" font-family="sans-serif" font-weight="bold" font-size="14">4</text>
    <text x="48" y="33" fill="#FFF" font-family="sans-serif" font-weight="bold" font-size="12">議事録 &amp; 保存</text>
    <text x="14" y="65" fill="#D1D5DB" font-size="10">• 結論・決定・残課題抽出</text>
    <text x="14" y="85" fill="#D1D5DB" font-size="10">• サマリー直接編集推敲</text>
    <text x="14" y="105" fill="#D1D5DB" font-size="10">• Markdown / JSON 保存</text>
    <text x="14" y="125" fill="#D1D5DB" font-size="10">• 履歴アーカイブ保存</text>
    <rect x="14" y="142" width="122" height="24" rx="4" fill="#065F46"/>
    <text x="24" y="158" fill="#FFF" font-size="10" font-weight="bold">📥 エクスポート</text>
  </g>

  <!-- 矢印 4 -> 5 -->
  <line x1="772" y1="175" x2="792" y2="175" stroke="#4B6651" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ステップ 5: 議論リレー -->
  <g transform="translate(795, 85)">
    <rect width="135" height="180" rx="10" fill="url(#stepGrad)" stroke="#3E4C52" stroke-width="1.2"/>
    <rect x="12" y="14" width="28" height="28" rx="6" fill="#7C3AED"/>
    <text x="21" y="33" fill="#FFF" font-family="sans-serif" font-weight="bold" font-size="14">5</text>
    <text x="48" y="33" fill="#FFF" font-family="sans-serif" font-weight="bold" font-size="12">次期リレー</text>
    <text x="14" y="65" fill="#D1D5DB" font-size="10">• サマリー自動引き継ぎ</text>
    <text x="14" y="85" fill="#D1D5DB" font-size="10">• 次フェーズ課題選定</text>
    <text x="14" y="105" fill="#D1D5DB" font-size="10">• 連続会議の開催</text>
    <text x="14" y="125" fill="#D1D5DB" font-size="10">• 親子チェーン形成</text>
    <rect x="14" y="142" width="107" height="24" rx="4" fill="#5B21B6"/>
    <text x="20" y="158" fill="#FFF" font-size="10" font-weight="bold">⚡ 次フェーズ設計</text>
  </g>
</svg>
